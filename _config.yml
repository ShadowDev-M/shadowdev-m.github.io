# SEO Settings
title: "Massimo Scaturchio"
tagline: "Personal Portfolio Website"
description: "Personal Portfolio Website"
logo: /assets/img/favicons/logo/logo.png

# URL Settings
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://shadowdev-m.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# TODO: Socials Rework with a data yaml file

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Front Matter Defaults
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
    values:
      layout: default


# Build Settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - .idea # Jekyll already excludes and files/folders that start with - or . but for some reason the site still rebuilds itself if it detects changes for this folder
